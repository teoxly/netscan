<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetScan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f3;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.2);
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --text-faint: #aaa;
      --accent: #1a1a1a;
      --accent-fg: #fff;
      --radius-md: 8px;
      --radius-lg: 12px;
      --info-bg: #e6f1fb;
      --info-fg: #185fa5;
      --success-bg: #eaf3de;
      --success-fg: #3b6d11;
      --warn-bg: #faeeda;
      --warn-fg: #854f0b;
      --danger-bg: #fcebeb;
      --danger-fg: #a32d2d;
      --secondary-bg: #f1efe8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(255,255,255,0.2);
        --text: #f0ede8;
        --text-muted: #999;
        --text-faint: #555;
        --accent: #f0ede8;
        --accent-fg: #1a1a18;
        --info-bg: #042c53;
        --info-fg: #85b7eb;
        --success-bg: #173404;
        --success-fg: #c0dd97;
        --warn-bg: #412402;
        --warn-fg: #fac775;
        --danger-bg: #501313;
        --danger-fg: #f09595;
        --secondary-bg: #2c2c2a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }
    .top-bar i { font-size: 22px; color: var(--text-muted); }
    .top-bar h1 { font-size: 18px; font-weight: 500; }
    .top-bar .version { font-size: 11px; color: var(--text-faint); margin-left: 4px; align-self: flex-end; margin-bottom: 2px; }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .card-header i { font-size: 16px; color: var(--text-muted); }
    .card-header h2 { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; }

    .input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; }
    .field input {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      padding: 0 10px;
      height: 36px;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--text-muted); }
    .field.f-target input { width: 240px; }
    .field.f-ports input { width: 170px; }
    .field.f-sm input { width: 80px; }

    .btn {
      display: flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 16px;
      font-size: 13px; font-weight: 500;
      border: none; border-radius: var(--radius-md);
      cursor: pointer; transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { opacity: 0.8; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary i { font-size: 15px; }

    .api-note {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "SF Mono", monospace;
    }

    .history-empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-faint);
      font-size: 13px;
    }
    .history-empty i { font-size: 32px; display: block; margin-bottom: 8px; }

    .scan-list { display: flex; flex-direction: column; gap: 8px; }

    .scan-item {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .scan-item:hover { border-color: var(--border-strong); }

    .scan-item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.7rem 1rem;
      cursor: pointer;
      user-select: none;
      background: var(--surface);
    }
    .scan-item-header i.icon-host { font-size: 16px; color: var(--text-muted); }

    .scan-target {
      font-family: "SF Mono", monospace;
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }

    .badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 99px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-running { background: var(--warn-bg); color: var(--warn-fg); }
    .badge-done    { background: var(--success-bg); color: var(--success-fg); }
    .badge-error   { background: var(--danger-bg); color: var(--danger-fg); }

    .scan-meta { font-size: 11px; color: var(--text-faint); white-space: nowrap; }

    .chevron { font-size: 14px; color: var(--text-faint); transition: transform 0.2s; }
    .scan-item.open .chevron { transform: rotate(180deg); }

    .scan-body {
      display: none;
      border-top: 0.5px solid var(--border);
      padding: 1rem;
      background: var(--surface);
    }
    .scan-item.open .scan-body { display: block; }

    .result-section { margin-bottom: 1.1rem; }
    .result-section:last-child { margin-bottom: 0; }

    .result-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 6px;
    }
    .info-cell {
      background: var(--secondary-bg);
      border-radius: var(--radius-md);
      padding: 8px 10px;
    }
    .info-cell .k { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
    .info-cell .v { font-size: 13px; font-family: "SF Mono", monospace; color: var(--text); word-break: break-all; }

    .ports-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ports-table th {
      text-align: left;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      border-bottom: 0.5px solid var(--border);
    }
    .ports-table td {
      padding: 5px 8px;
      font-family: "SF Mono", monospace;
      border-bottom: 0.5px solid var(--border);
      color: var(--text);
    }
    .ports-table tr:last-child td { border-bottom: none; }
    .port-num { color: var(--info-fg); font-weight: 500; }
    .svc-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 7px;
      background: var(--info-bg);
      color: var(--info-fg);
      border-radius: 4px;
    }

    .error-msg {
      font-size: 12px;
      color: var(--danger-fg);
      font-family: "SF Mono", monospace;
      padding: 10px;
      background: var(--danger-bg);
      border-radius: var(--radius-md);
    }

    .spinner {
      display: inline-block;
      width: 9px; height: 9px;
      border: 2px solid var(--warn-fg);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    hr.section-divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin: 1rem 0;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="top-bar">
    <i class="ti ti-radar"></i>
    <h1>netscan</h1>
    <span class="version">v1.0</span>
  </div>

  <div class="card">
    <div class="card-header">
      <i class="ti ti-player-play"></i>
      <h2>new scan</h2>
    </div>
    <div class="input-row">
      <div class="field f-target">
        <label>target</label>
        <input type="text" id="inp-target" placeholder="google.com / 8.8.8.8 / 192.168.1.0/24" />
      </div>
      <div class="field f-ports">
        <label>ports (opțional)</label>
        <input type="text" id="inp-ports" placeholder="80,443,22" />
      </div>
      <div class="field f-sm">
        <label>timeout (s)</label>
        <input type="number" id="inp-timeout" value="1.0" min="0.1" max="10" step="0.1" />
      </div>
      <div class="field f-sm">
        <label>threads</label>
        <input type="number" id="inp-conc" value="100" min="1" max="500" step="10" />
      </div>
      <button class="btn btn-primary" id="btn-scan" onclick="startScan()">
        <i class="ti ti-player-play"></i> scan
      </button>
    </div>
    <div class="api-note">
      <i class="ti ti-plug"></i>
      backend: <strong id="api-url">http://localhost:8000</strong>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <i class="ti ti-history"></i>
      <h2>istoricul scanărilor</h2>
    </div>
    <div id="scan-list">
      <div class="history-empty">
        <i class="ti ti-radar-2"></i>
        nicio scanare încă — introdu un target și apasă scan
      </div>
    </div>
  </div>

</div>

<script>
  const API = 'http://localhost:8000';
  const scans = [];

  function startScan() {
    const target = document.getElementById('inp-target').value.trim();
    if (!target) { alert('Introdu un target!'); return; }

    const portsRaw = document.getElementById('inp-ports').value.trim();
    const ports = portsRaw
      ? portsRaw.split(',').map(p => parseInt(p.trim())).filter(n => !isNaN(n))
      : null;
    const timeout = parseFloat(document.getElementById('inp-timeout').value) || 1.0;
    const concurrency = parseInt(document.getElementById('inp-conc').value) || 100;

    const btn = document.getElementById('btn-scan');
    btn.disabled = true;

    fetch(`${API}/scans`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target, ports, timeout, concurrency })
    })
    .then(r => r.json())
    .then(data => {
      const entry = {
        id: data.scan_id,
        target,
        status: 'running',
        startedAt: new Date(),
        result: null,
        error: null,
      };
      scans.unshift(entry);
      renderList();
      btn.disabled = false;
      pollScan(entry);
    })
    .catch(err => {
      alert('Nu mă pot conecta la backend:\n' + err.message);
      btn.disabled = false;
    });
  }

  function pollScan(entry) {
    const interval = setInterval(() => {
      fetch(`${API}/scans/${entry.id}`)
        .then(r => r.json())
        .then(data => {
          if (data.status === 'done') {
            entry.status = 'done';
            entry.result = data.results;
            clearInterval(interval);
            renderList();
          } else if (data.status === 'error') {
            entry.status = 'error';
            entry.error = data.error || 'Eroare necunoscută';
            clearInterval(interval);
            renderList();
          }
        })
        .catch(() => {
          entry.status = 'error';
          entry.error = 'Conexiune pierdută cu backend-ul';
          clearInterval(interval);
          renderList();
        });
    }, 2000);
  }

  function renderList() {
    const el = document.getElementById('scan-list');
    if (!scans.length) {
      el.innerHTML = '<div class="history-empty"><i class="ti ti-radar-2"></i>nicio scanare încă</div>';
      return;
    }
    el.innerHTML = '<div class="scan-list">' + scans.map(renderScanItem).join('') + '</div>';
  }

  function renderScanItem(entry) {
    const timeStr = entry.startedAt.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    let badge = '';
    if (entry.status === 'running') badge = '<span class="badge badge-running"><span class="spinner"></span> running</span>';
    else if (entry.status === 'done')  badge = '<span class="badge badge-done"><i class="ti ti-check" style="font-size:11px"></i> done</span>';
    else                               badge = '<span class="badge badge-error"><i class="ti ti-x" style="font-size:11px"></i> error</span>';

    let body = '';
    if (entry.status === 'running') {
      body = '<div style="color:var(--text-muted);font-size:13px;padding:6px 0;">Se scanează, te rog așteaptă...</div>';
    } else if (entry.status === 'error') {
      body = `<div class="error-msg">${entry.error}</div>`;
    } else if (entry.result) {
      body = entry.result.map((r, i) =>
        (i > 0 ? '<hr class="section-divider">' : '') + renderResult(r)
      ).join('');
    }

    return `
      <div class="scan-item" id="item-${entry.id}">
        <div class="scan-item-header" onclick="toggleItem('${entry.id}')">
          <i class="ti ti-server-2 icon-host"></i>
          <span class="scan-target">${entry.target}</span>
          ${badge}
          <span class="scan-meta">${timeStr}</span>
          <i class="ti ti-chevron-down chevron"></i>
        </div>
        <div class="scan-body">${body}</div>
      </div>`;
  }

  function renderResult(r) {
    const hi   = r.host_info || {};
    const meta = r.metadata  || {};
    const ip_info = meta.ip_info;
    const whois   = hi.whois;
    const dns     = hi.dns_records || {};
    const ports   = r.ports || [];

    let html = '';

    html += `<div class="result-section">
      <div class="result-label">host</div>
      <div class="info-grid">
        <div class="info-cell"><div class="k">IP</div><div class="v">${hi.resolved_ip || '—'}</div></div>
        <div class="info-cell"><div class="k">hostname</div><div class="v">${hi.hostname || '—'}</div></div>
        <div class="info-cell"><div class="k">tip</div><div class="v">${hi.resolved_ip && hi.resolved_ip.startsWith('192') ? 'privat' : 'public'}</div></div>
      </div>
    </div>`;

    if (ip_info) {
      html += `<div class="result-section">
        <div class="result-label">locație</div>
        <div class="info-grid">
          <div class="info-cell"><div class="k">țară</div><div class="v">${ip_info.country}</div></div>
          <div class="info-cell"><div class="k">oraș</div><div class="v">${ip_info.city}</div></div>
          <div class="info-cell"><div class="k">ISP</div><div class="v">${ip_info.isp}</div></div>
          <div class="info-cell"><div class="k">org</div><div class="v">${ip_info.org}</div></div>
          <div class="info-cell"><div class="k">coordonate</div><div class="v">${ip_info.lat}, ${ip_info.lon}</div></div>
          <div class="info-cell"><div class="k">timezone</div><div class="v">${ip_info.timezone}</div></div>
        </div>
      </div>`;
    }

    if (whois) {
      html += `<div class="result-section">
        <div class="result-label">whois</div>
        <div class="info-grid">
          <div class="info-cell"><div class="k">registrar</div><div class="v">${whois.registrar}</div></div>
          <div class="info-cell"><div class="k">înregistrat</div><div class="v">${whois.creation_date}</div></div>
          <div class="info-cell"><div class="k">expiră</div><div class="v">${whois.expiration_date}</div></div>
          ${whois.name_servers && whois.name_servers.length ? `<div class="info-cell"><div class="k">nameservers</div><div class="v">${whois.name_servers[0]}</div></div>` : ''}
        </div>
      </div>`;
    }

    if (dns.a_records && dns.a_records.length) {
      html += `<div class="result-section">
        <div class="result-label">dns</div>
        <div class="info-grid">
          <div class="info-cell"><div class="k">A</div><div class="v">${dns.a_records.join(', ')}</div></div>
          ${dns.mx_records && dns.mx_records.length ? `<div class="info-cell"><div class="k">MX</div><div class="v">${dns.mx_records[0]}</div></div>` : ''}
          ${dns.ns_records && dns.ns_records.length ? `<div class="info-cell"><div class="k">NS</div><div class="v">${dns.ns_records[0]}</div></div>` : ''}
        </div>
      </div>`;
    }

    if (ports.length) {
      html += `<div class="result-section">
        <div class="result-label">porturi deschise (${ports.length})</div>
        <table class="ports-table">
          <tr><th>port</th><th>serviciu</th><th>banner</th></tr>
          ${ports.map(p => `<tr>
            <td class="port-num">${p.port}</td>
            <td><span class="svc-badge">${p.service}</span></td>
            <td style="color:var(--text-muted)">${p.banner || '—'}</td>
          </tr>`).join('')}
        </table>
      </div>`;
    } else {
      html += `<div class="result-section">
        <div style="font-size:13px;color:var(--text-muted);">niciun port deschis detectat</div>
      </div>`;
    }

    return html;
  }

  function toggleItem(id) {
    const el = document.getElementById('item-' + id);
    if (el) el.classList.toggle('open');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('inp-target').addEventListener('keydown', e => {
      if (e.key === 'Enter') startScan();
    });
  });
</script>
</body>
</html>
